name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [24, 26]
        include:
          - os: windows-latest
            node: 24

    steps:
      # Windows runners default to CRLF checkouts, which Prettier's `endOfLine: lf` rejects.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use repository npm version
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      # Runs the suite once, with coverage thresholds, as part of the single local gate.
      - name: Verify package
        run: npm run verify

      # `git status` also catches newly generated pages, which `git diff` would miss.
      - name: Check generated API docs are committed
        shell: bash
        run: |
          drift="$(git status --porcelain -- docs/api)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::docs/api is out of date; run npm run docs:api and commit the result."
            exit 1
          fi
