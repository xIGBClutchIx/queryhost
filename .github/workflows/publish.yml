name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      # A mismatched tag fails in seconds, before dependencies install or the gate runs.
      - name: Check release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm run release:check -- "$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify

      # The gate just ran; --ignore-scripts skips prepublishOnly so it does not run twice.
      - name: Publish with provenance
        run: npm publish --access public --provenance --ignore-scripts

  # Starts each hosted consumer's `QueryHost release` workflow with the version just
  # published, so the bump pull request opens without waiting for its 15-minute schedule,
  # which stays as the fallback. A separate job keeps the dispatch token away from the
  # publish job, and this job checks out and runs nothing from the release.
  consumers:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Start the consumer bumps
        env:
          # Fine-grained token limited to Actions read and write on the two consumers.
          GH_TOKEN: ${{ secrets.QUERYHOST_CONSUMER_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::QUERYHOST_CONSUMER_DISPATCH_TOKEN is not set; the consumers' schedules pick this release up."
            exit 0
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not an exact release version: $TAG"
            exit 1
          fi
          # Try every consumer even if one fails, then fail so the miss is visible.
          failed=0
          for repo in xIGBClutchIx/queryhost-api xIGBClutchIx/queryhost-web; do
            if gh workflow run queryhost-release.yml -R "$repo" -f version="$version"; then
              echo "Started the queryhost $version bump in $repo."
            else
              echo "::error::Could not start the queryhost $version bump in $repo; its schedule still picks it up."
              failed=1
            fi
          done
          exit "$failed"
