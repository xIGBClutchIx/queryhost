name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run verify
          npm run release:check -- "${{ github.event.release.tag_name }}"

      - name: Publish with provenance
        run: npm publish --access public --provenance

  rollout:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      # Each downstream repository opens its own pin-bump pull request; this only asks them to
      # start now instead of on their hourly schedule. The token needs Actions write access to
      # queryhost-api and queryhost-web and nothing else.
      - name: Request API and web bump pull requests
        env:
          GH_TOKEN: ${{ secrets.QUERYHOST_ROLLOUT_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::QUERYHOST_ROLLOUT_TOKEN is not set; the API and web pick up ${TAG} on their hourly schedule."
            exit 0
          fi
          for repo in queryhost-api queryhost-web; do
            gh workflow run queryhost-release.yml --repo "$GITHUB_REPOSITORY_OWNER/$repo" -f version="${TAG#v}"
          done
